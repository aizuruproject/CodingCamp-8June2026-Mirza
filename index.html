<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <section class="left-panel">
            <header class="block total-balance-box">
                <h2>Total Balance</h2>
                <strong class="balance-amount" id="totalBalance">$0.00</strong>
            </header>
            
            <section class="block">
                <h2>Transactions</h2>
                <ul class="transaction-list" id="transactionList">
                    <li class="empty-state">Belum ada transaksi.</li>
                </ul>
            </section>
        </section>

        <section class="right-panel">
            <form id="transactionForm" class="block add-transaction-box" autocomplete="off">
                <h2>Add Transaction</h2>
                
                <p class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="Misal: Bakwan" required>
                </p>
                
                <p class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="Misal: 14.94" required>
                </p>
                
                <p class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="" disabled selected>Pilih Kategori</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </p>
                
                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>

            <section class="block spending-container">
                <h2>Spending by Category</h2>
                <figure class="chart-wrapper">
                    <div class="pie-chart" id="pieChart"></div>
                </figure>
                <ul class="chart-legend" id="chartLegend"></ul>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
